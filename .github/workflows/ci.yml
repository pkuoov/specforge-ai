name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck

      - name: Public repo audit
        run: pnpm public-audit

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Package dry run
        run: |
          mkdir -p /tmp/testgen-packcheck
          pnpm -r packcheck

      - name: Dogfood — generate tests for examples
        run: |
          node packages/core/bin/testgen.js examples/basic-function/clamp.ts --dry-run --extractor=typescript
